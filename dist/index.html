gments:[u("Charles 手心捏着一枚泛着金光的子弹，他盯着徐清的心口。")]},{type:"heading",segments:[u("CHARLES POV:")]},{type:"action",segments:[u("那里飘着一团火——被一层灰白的烟死死裹住，忽明忽暗，像随时会被自己闷灭。")]},{type:"heading",segments:[u("INT. 客厅 - 夜")]},{type:"name",segments:[u("Charles")]},{type:"paren",segments:[u("(喃喃)")]},{type:"line",segments:[u("她要把自己憋死了。")]},{type:"action",segments:[u("Charles 抬手，将手心里的子弹塞进手枪，瞄准那团被烟雾裹住的火。")]},{type:"name",segments:[u("Max")]},{type:"paren",segments:[u("(想拦下)")]},{type:"line",segments:[u("Charles——")]},{type:"action",segments:[u("一声轻响，一缕金色的雾气钻进徐清的胸口，被那层灰烟瞬间吞掉，又猛地炸开。")]},{type:"action",segments:[u("徐清浑身一颤，像是被针扎了一下。她盯着屏幕，眼眶毫无预兆地红了，接着，眼泪大颗地砸在了桌上。她用手捂住脸。")]},{type:"action",segments:[u("周涣之被她的反应吓到了，他慌忙坐直，脸上露出懊悔的表情。")]},{type:"name",segments:[u("周涣之")]},{type:"paren",segments:[u("(慌张)")]},{type:"line",segments:[u("小清？怎么了？小清？对不起我不是打算逼着你——")]},{type:"action",segments:[u("徐清的呼吸因为哭泣而不稳，但金弹迸发的滚烫火焰窜高，从她的胸口蔓延到她的面庞。她张口——火焰张开了口。")]},{type:"name",segments:[u("徐清")]},{type:"line",segments:[u("我不想看未来。")]},{type:"action",segments:[u("她的声音颤抖，但这句话平静地从她的口中流淌出来。")]},{type:"action",segments:[u("Max 目瞪口呆地看了看徐清，又转头看了看 Charles。")]},{type:"name",segments:[u("Max")]},{type:"paren",segments:[u("(靠近 Charles，小声)")]},{type:"line",segments:[u("你用的铅弹？")]},{type:"action",segments:[u("Charles 看着徐清胸口熊熊燃烧的火焰，困惑地摇头。她垂着头，眼泪滴入燃烧的金焰中，火焰又窜高了一寸。")]},{type:"name",segments:[u("Charles")]},{type:"paren",segments:[u("(小声回道)")]},{type:"line",segments:[u("怎么可能！她的爱情之火烧得快到房顶了……真见鬼……")]},{type:"action",segments:[u("Max 低头看向平板，徐清的愿望依然在心愿的溪流中漂浮着，毫无变化。")]},{type:"name",segments:[u("周涣之 (V.O.)")]},{type:"line",segments:[u("谁的未来？")]},{type:"action",segments:[u("他的语气比刚才冷静得多。")]},{type:"name",segments:[u("Max")]},{type:"paren",segments:[u("(震惊中带着幸灾乐祸)")]},{type:"line",segments:[u("丘比特，这是什么情况？翻车了？")]},{type:"name",segments:[u("Charles")]},{type:"paren",segments:[u("(没好气)")]},{type:"line",segments:[u("把快乐建立在人家的痛苦上，小心被派去做社区服务。")]},{type:"action",segments:[u("他狐疑地把弹匣拆开，一排金弹闪闪发光。")]},{type:"name",segments:[u("Charles (CONT'D)")]},{type:"line",segments:[u("我就说不可能是装错弹了——到底为什么——")]},{type:"name",segments:[u("周涣之 (V.O.)")]},{type:"line",segments:[u("到底发生什么了。")]},{type:"insert",segments:[u("INSERT — 电脑屏幕")]},{type:"action",segments:[u("周涣之的眉头紧皱，面带担忧。他手里拿着手机，时不时低头刷一下。")]},{type:"name",segments:[u("周涣之")]},{type:"line",segments:[u("需要我过去陪你吗？我看最近的一班飞机明天早上就能到——")]},{type:"action",segments:[u("徐清猛地抬头看向屏幕。")]},{type:"name",segments:[u("徐清")]},{type:"paren",segments:[u("(突然大声)")]},{type:"line",segments:[u("不行！")]},{type:"action",segments:[u('她猛地摇头，也说不出别的，只是一个劲地小声重复着"不行"。')]},{type:"name",segments:[u("周涣之")]},{type:"line",segments:[u("——你知道如果你不告诉我发生了什么，我是不可能放弃的吧？")]},{type:"action",segments:[u("徐清再次抬眼看了一眼电脑屏幕，深吸了一口气，试图张嘴说话，又顿住。死寂循环僵持着。")]},{type:"action",segments:[u("她转头扯过了背后的枕头，把它攥在怀里。")]},{type:"name",segments:[u("徐清")]},{type:"paren",segments:[u("(哽咽，声音发抖，语速越来越快)")]},{type:"line",segments:[u("论文教授让我换个思路——我明明已经写了一年了——实习投的全都没消息……下学期的 TA 工作也——我——我知道你们那边最近在裁员——")]},{type:"name",segments:[u("周涣之")]},{type:"paren",segments:[u("(声音发哑)")]},{type:"line",segments:[u("那……就再读一年呗。")]},{type:"action",segments:[u("徐清猛地抬头。")]},{type:"name",segments:[u("周涣之")]},{type:"paren",segments:[u("(语气轻松)")]},{type:"line",segments:[u("我工作三四年了不至于一点存款都没有的好吧——")]},{type:"action",segments:[u("屏幕上的周涣之笑着看向镜头，他笑嘻嘻地，但能看得出他确实有压力。")]},{type:"name",segments:[u("周涣之 (CONT'D)")]},{type:"line",segments:[u("况且你才读了三年多就想着毕业——你打算让其他读七八年的博士嫉妒死你吗？")]},{type:"action",segments:[u("徐清眨眨眼，眼泪又开始掉，肩膀一抽一抽的。")]},{type:"action",segments:[u("Max 盯着平板，那行愿望像雾气一样融进了愿望的溪流中，至始至终没有变化。")]},{type:"insert",segments:[u("INSERT — 平板屏幕")]},{type:"screen",segments:[u("愿望：希望他不要担心我")]},{type:"name",segments:[u("Max")]},{type:"line",segments:[u("Charles.")]},{type:"action",segments:[u("他把平板转向 Charles，Charles 看着平板，又看了看依然在哭的徐清和屏幕里努力安慰她的周涣之，紧了紧手里从手枪里卸下来的金弹。")]},{type:"trans",segments:[u("CUT TO:")]}]}]},uE={id:"act-4",actNo:"IV.",title:"A Warm Snow",scenes:[{id:"scene-4-1",sceneNo:"1",slug:["25 DEC 2025","04:09","北极 · 车库"],title:"The Return",lines:[{type:"heading",segments:[u("INT. 节日 definition:"A lozenge-pointed steel graver used to incise lines into a copperplate. The cleaner the furrow, the colder the hand that drove it.",image:"/plates/burin.jpg",imageCaption:"Pl. II — The burin at work"},speculum:{id:"speculum",no:"02",kicker:'Lat. "Mirror"',term:"Speculum",definition:"Speculum Romanae Magnificentiae — a 16th-century anthology of prints celebrating the monuments of Rome.",image:"/plates/temple.jpg",imageCaption:"Pl. I — Portico of the Temple of Julius"},verso:{id:"verso",no:"03",kicker:"Codicology",term:"Verso",definition:"The back of a leaf; the left-hand page of an open folio. Secrets keep to the verso."},foxing:{id:"foxing",no:"04",kicker:"Paper · Decay",term:"Foxing",definition:"Reddish-brown spots that bloom across old paper, caused by iron oxidation. Irreversible."},imprimatur:{id:"imprimatur",no:"05",kicker:"Print · Law",term:"Imprimatur",definition:'"Let it be printed." The official licence permitting publication.'},campo:{id:"campo",no:"06",kicker:"Rome · Piazza",term:"Campo de Fiori",definition:"A Roman square that has held vegetable stalls and executions since the fifteenth century.",image:"/plates/map.jpg",imageCaption:"Pl. III — The field, from above"},sirocco:{id:"sirocco",no:"07",kicker:"Weather",term:"Sirocco",definition:"A hot wind crossing from the Sahara into southern Europe."},bruno:{id:"bruno",no:"08",kicker:"History · 1600",term:"Giordano Bruno",definition:"Philosopher burned at the stake in Campo de Fiori in 1600."},cartouche:{id:"cartouche",no:"09",kicker:"Ornament",term:"Cartouche",definition:"A scrolled ornamental frame for titles and coats of arms.",image:"/plates/cartouche.jpg",imageCaption:"Pl. IV — An empty cartouche"},ashmole:{id:"ashmole",no:"10",kicker:"Antiquarian · 1672",term:"Ashmole",definition:"Elias Ashmole, antiquarian. His 1672 work carried engravings of St George choir at Windsor.",image:"/plates/choir.jpg",imageCaption:"Pl. V — St George Chapel Choir, Windsor"},ultramarine:{id:"ultramarine",no:"11",kicker:"Pigment",term:"Ultramarine",definition:"Blue ground from lapis lazuli, once dearer than gold."},silverpoint:{id:"silverpoint",no:"12",kicker:"Drawing",term:"Silverpoint",definition:"A stylus of silver wire that draws in faint grey and tarnishes to brown. Cannot be erased."},palimpsest:{id:"palimpsest",no:"13",kicker:"Codicology",term:"Palimpsest",definition:"A manuscript scraped clean and overwritten, the earlier text ghosting through."},chiaroscuro:{id:"chiaroscuro",no:"14",kicker:"Art · Light",term:"Chiaroscuro",definition:"The modelling of volume through light and shadow."},"max-verstappen":{id:"max-verstappen",no:"15",kicker:"F1 · World Champion",term:"Max Verstappen",definition:"Triple Formula 1 World Champion (2021–2023). Red Bull Racing. Known for preternatural calm under pressure — a quality the North Pole urgently requires.",image:"/plates/burin.jpg",imageCaption:"Pl. VI — The champion, in red"},"oh-santa":{id:"oh-santa",no:"16",kicker:"Music · Accelerated",term:'"Oh! Santa"',definition:"A Christmas carol remixed at 178 BPM for the garage speakers. Daniel Ricciardo added a bass drop at 1:42 that once caused a structural incident."},"daniel-ricciardo":{id:"daniel-ricciardo",no:"17",kicker:"Former Santa · Retired",term:"Daniel Ricciardo",definition:"The previous Santa. F1 driver, prank enthusiast, and owner of the RGB speaker incident. Left the post to pursue other dreams. Left behind chaos.",image:"/plates/moth.jpg",imageCaption:"Pl. VII — The moth, attracted to the flame"},rudolph:{id:"rudolph",no:"18",kicker:"AI · Co-Pilot",term:"Rudolph",definition:"The AI co-pilot system. Pixel-reindeer avatar on the dashboard. Programmed for excessive enthusiasm. Cannot be muted without a Level 3 override."},"reindeer-buggy":{id:"reindeer-buggy",no:"19",kicker:"Vehicle · Class-A",term:"Reindeer Buggy 19",definition:"A floating sleigh disguised as a sports car. 19 iterations in. Suspension leans left. The reindeer decal was Daniel's idea.",image:"/plates/map.jpg",imageCaption:"Pl. VIII — The route, from above"},tablet:{id:"tablet",no:"20",kicker:"Interface · Transparent",term:"平板",definition:"A transparent tablet computer. Displays the global wish list. 9999+ unread letters. A red badge that cannot be silenced."},"charles-leclerc":{id:"charles-leclerc",no:"21",kicker:"F1 · Cupid",term:"Charles Leclerc",definition:"Monégasque Formula 1 driver, reassigned here as the holiday department’s reluctant Cupid. Fast, precise, and unconvinced by seasonal romance."},dionysus:{id:"dionysus",no:"22",kicker:"Greek Myth · Revelry",term:"狄俄尼索斯",definition:"Greek god of wine, theatre, ecstasy, and dangerous parties. His presence tends to create more emotional connections than Cupid can safely process."},artemis:{id:"artemis",no:"23",kicker:"Greek Myth · Hunt",term:"阿尔忒弥斯",definition:"Greek goddess of the hunt, wilderness, and the moon; fiercely independent and generally outside Cupid’s preferred jurisdiction."},eileithyia:{id:"eileithyia",no:"24",kicker:"Greek Myth · Birth",term:"厄勒提亚",definition:"Greek goddess of childbirth. In Charles’s complaint, she represents the inevitable operational consequences of Dionysian matchmaking."},hermes:{id:"hermes",no:"25",kicker:"Greek Myth · Messenger",term:"赫尔墨斯",definition:"Messenger of the gods and patron of travellers. The divine department’s fastest courier, routinely asked to cover emergency shifts."},"true-love-fire":{id:"true-love-fire",no:"26",kicker:"Cupid · Diagnostic",term:"真爱之火",definition:"Cupid’s visible diagnostic for a durable emotional bond. A steady flame indicates connection; smoke indicates a relationship nearing collapse."},pistol:{id:"pistol",no:"27",kicker:"Weaponry · Cupid",term:"手枪",definition:"Standard issue Cupid sidearm. Replaced the traditional bow and arrow in 1914 for better urban efficiency. Fires various emotional payloads."},smoke:{id:"smoke",no:"28",kicker:"Visual Metaphor",term:"浓烟",definition:"The visual manifestation of resentment, exhaustion, and unresolved conflict. Thick enough to obscure any remaining true love fire."},bauble:{id:"bauble",no:"29",kicker:"Holiday Decor",term:"装饰球",definition:"A glass Christmas tree ornament. Highly reflective, prone to shattering. Often the first casualty in holiday domestic disputes."},"lead-bullet":{id:"lead-bullet",no:"30",kicker:"Ammunition · Negative",term:"铅弹",definition:"Ammunition causing immediate physiological aversion and the desire to leave the premises. Strictly for biological targets. Highly effective for crowd control."},"last-year-incident":{id:"last-year-incident",no:"31",kicker:"Department Lore",term:"去年的事故",definition:"An operational disaster involving Daniel Ricciardo, excessive eggnog, and a highly public sleigh parking violation. Led to the strict new dress code."},regulation:{id:"regulation",no:"32",kicker:"HR Policy",term:"规定",definition:'Section 4, Paragraph A: "All operatives must remain in full seasonal uniform during delivery to prevent civilian psychological trauma." Widely hated.'},"gold-bullet":{id:"gold-bullet",no:"33",kicker:"Ammunition · Positive",term:"金弹",definition:"The classic Cupid payload. Reignites dormant affection and lowers defensive emotional barriers. Best deployed after a moment of shared vulnerability."},terminal:{id:"terminal",no:"34",kicker:"Hardware",term:"终端",definition:'Cupid’s handheld diagnostic device. Used to scan human emotional frequencies, locate matches, and map active "true-love fire" sites in real time.'},sebastian:{id:"sebastian",no:"35",kicker:"F1 · Retired Cupid",term:"Sebastian Vettel",definition:"The former legendary head of the Cupid department. Quadruple World Champion (2010–2013). Retired to enjoy a quiet life, leaving the division severely understaffed.",image:"/plates/temple.jpg",imageCaption:"The temple of the retired champion"},"equipment-dept":{id:"equipment-dept",no:"36",kicker:"Holiday Dept · Support",term:"设备部",definition:"The Equipment Department. Responsible for maintaining tablets, wish-filters, and sleigh systems. Perpetually understaffed, chronically blamed, and — per Max — the source of every glitch."},"yvette-young":{id:"yvette-young",no:"37",kicker:"Musician · Guitarist",term:"Yvette Young",definition:"American musician and visual artist, frontwoman of the band Covet. Known for her intricate two-handed tapping technique and poetic, math-rock guitar compositions."},"candy-cane":{id:"candy-cane",no:"38",kicker:"Confectionery",term:"拐杖糖",definition:"A candy cane — a peppermint stick bent into a hook. A near-universal signal that a beverage is deliberately, and pointedly, non-alcoholic.",image:"/plates/moth.jpg",imageCaption:"Pl. XIV — Cranberry juice, pointedly non-alcoholic"},douyin:{id:"douyin",no:"39",kicker:"Media · Attention",term:"抖音",definition:"Douyin (TikTok). The short-video platform that, in Charles’s estimation, has decisively out-competed both organized religion and Santa Claus for the modern teenager’s faith."},"the-tide":{id:"the-tide",no:"40",kicker:"Song · Covet",term:"The Tide",definition:"A song by Covet (Yvette Young’s band). Its lyrics read almost like poetry — the kind of quiet, surging piece that gives a shy fan something safe to talk about."},"math-rock":{id:"math-rock",no:"41",kicker:"Genre",term:"数学摇滚",definition:"Math rock — a rhythmically complex, angular style of rock built on irregular time signatures, unexpected stops, and intricate guitar tapping. An acquired, devoted taste."},gingerbread:{id:"gingerbread",no:"42",kicker:"Offering · Trade",term:"姜饼人",definition:"A small spiced cookie in the shape of a person. The traditional bribe offered to Santa by well-prepared children. Often left uneaten when the wish is larger than the cookie.",image:"/plates/moth.jpg",imageCaption:"Pl. XIII — The gingerbread man — offered in trade"},"photo-frame":{id:"photo-frame",no:"43",kicker:"Domestic · Trace",term:"相框合照",definition:"A framed photograph whose contents have been recently swapped. The fresh cellophane still on the glass betrays how recently th
